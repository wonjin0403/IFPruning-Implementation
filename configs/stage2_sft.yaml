defaults:
  - _self_

seed: 777
run_name: ifpruning_stage2
tokenizer: /nas_data2/LLM_weight/llm/llama3.1/Llama-3.1-8B-Instruct

init_from: checkpoints/stage1_ifpruning/step_00060000

train_datasets:
  - processed_datasets/tulu_v2_sft
  - processed_datasets/flan_v2_sft

output_dir: checkpoints/stage2_sft

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
num_workers: 2
gradient_checkpointing: true

lr_llama: 5.0e-6
lr_predictor: 5.0e-5
weight_decay: 0.1
warmup_ratio: 0.03
lr_scheduler: cosine
max_steps: 60000
max_grad_norm: 1.0

logging_steps: 20
save_steps: 2000
report_to: tensorboard

hydra:
  run:
    dir: outputs/stage2/${now:%Y-%m-%d_%H-%M-%S}
